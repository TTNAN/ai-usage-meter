[package]
name = "ai-usage-core"
version = "0.7.1"
description = "Usage providers, low-quota alert rules, the menu-bar icon and the screen-edge maths behind AI Usage Meter's rings popover and compact dock bar."
authors = ["TTNAN"]
license = "MIT"
edition = "2021"
rust-version = "1.77"
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls", "system-proxy"] }
