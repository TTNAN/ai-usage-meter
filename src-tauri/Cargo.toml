[package]
name = "ai-usage-meter"
version = "0.3.0"
description = "See how much Claude, Codex and Grok quota you have left — right from your menu bar / system tray."
authors = ["TTNAN"]
license = "MIT"
repository = "https://github.com/TTNAN/ai-usage-meter"
edition = "2021"
rust-version = "1.77"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "macos-private-api"] }
tauri-plugin-autostart = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
opt-level = "s"
