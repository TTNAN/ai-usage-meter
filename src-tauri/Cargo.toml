[package]
name = "ai-usage-meter"
version = "0.7.1"
description = "See how much Claude, ChatGPT (Codex), Grok, Gemini and GitHub Copilot quota you have left — as a rings popover or a compact dock bar, right from your menu bar / system tray."
authors = ["TTNAN"]
license = "MIT"
repository = "https://github.com/TTNAN/ai-usage-meter"
edition = "2021"
rust-version = "1.90"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "macos-private-api"] }
tauri-plugin-autostart = "2"
tauri-plugin-notification = "2"
tauri-plugin-global-shortcut = "2"
ai-usage-core = { path = "crates/ai-usage-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
lto = true
codegen-units = 1
strip = true
opt-level = "s"
