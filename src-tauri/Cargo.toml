[package]
name = "ai-usage-meter"
version = "0.1.0"
description = "See how much AI usage you have left — Claude, Codex and Grok — right from your menu bar / system tray."
authors = ["TTNAN"]
license = "MIT"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }

[profile.release]
lto = true
codegen-units = 1
