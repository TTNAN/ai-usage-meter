name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    name: Unit tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Run Rust unit tests
        working-directory: src-tauri
        # No --locked: no Cargo.lock is committed yet (crates.io is too slow
        # from the dev VM to generate one); CI generates it on first run.
        run: cargo test

  build:
    name: Build (${{ matrix.os }})
    needs: test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
          - os: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable

      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "^2"

      - name: Build Tauri app
        run: cargo tauri build

      # Smoke test: the release binary must start, report status as JSON
      # and exit 0. With AI_USAGE_METER_MOCK=1 it exercises the demo-data
      # path; without it, it exercises real credential discovery (expected:
      # not_connected on a clean runner). This proves the binary RUNS on a
      # real Mac / real Windows machine. It does NOT prove what the
      # menu-bar window looks like — that still needs a human with a real Mac.
      - name: Smoke test (mock data)
        env:
          AI_USAGE_METER_MOCK: "1"
        run: |
          ./src-tauri/target/release/ai-usage-meter --smoke-test || ./src-tauri/target/release/ai-usage-meter.exe --smoke-test
        shell: bash

      - name: Smoke test (no credentials)
        run: |
          ./src-tauri/target/release/ai-usage-meter --smoke-test || ./src-tauri/target/release/ai-usage-meter.exe --smoke-test
        shell: bash

      - name: Upload macOS artifact
        if: matrix.os == 'macos-latest'
        uses: actions/upload-artifact@v4
        with:
          name: ai-usage-meter-macos
          path: |
            src-tauri/target/release/bundle/dmg/*.dmg
            src-tauri/target/release/bundle/macos/*.app
          if-no-files-found: error

      - name: Upload Windows artifact
        if: matrix.os == 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: ai-usage-meter-windows
          path: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

  release:
    name: Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: List artifacts
        run: find artifacts -type f | sort
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/**/*.dmg
            artifacts/**/*.msi
            artifacts/**/*.exe
          generate_release_notes: true
